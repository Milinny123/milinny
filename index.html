<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETF Workbench</title>
  <style>
    :root { color-scheme: light; --ink: #19212b; --muted: #66717f; --line: #dfe5eb; --bg: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 56px 20px; }
    section { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
    .eyebrow { color: #1769aa; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 8px 0; font-size: clamp(28px, 5vw, 44px); line-height: 1.15; }
    p { color: var(--muted); }
    code { background: #f0f3f6; border-radius: 4px; padding: 2px 5px; }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="eyebrow">ETF WORKBENCH · 2000 CNY MODE</div>
      <h1>全市场 ETF 与支付宝 C 类基金仪表盘</h1>
      <p>仪表盘尚未运行。GitHub Actions 完成首次早盘或尾盘任务后，脚本会将实时动量、相对强弱、均线趋势和回撤数据写入此页面。</p>
      <p>本地测试可运行 <code>python etf_workbench.py</code>。</p>
    </section>
  </main>
</body>
</html>
